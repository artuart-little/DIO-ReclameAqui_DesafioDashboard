<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche Sales Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Plugin para exibir as percentagens dentro do gráfico de rosca -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #4B4C4D; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #D5001C; }
        .glass-card { background: rgba(30, 30, 30, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="bg-gradient-to-br from-[#0a0a0a] to-[#1a1a1a] text-gray-200 min-h-screen p-4 md:p-8">

    <div class="max-w-[1400px] mx-auto space-y-6">
        
        <!-- Header & Filtros -->
        <div class="glass-card p-6 rounded-2xl shadow-2xl flex flex-col xl:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-4">
                <div class="w-3 h-12 bg-gradient-to-b from-[#D5001C] to-[#8a0012] rounded-full"></div>
                <div>
                    <h1 class="text-3xl font-bold tracking-tight text-white">Porsche <span class="text-[#8A8D8F] font-light">Intelligence</span></h1>
                    <p class="text-xs text-gray-400 mt-1">Análise de Performance de Vendas</p>
                </div>
            </div>
            
            <div class="flex flex-wrap gap-4 w-full xl:w-auto">
                <div class="flex-1 min-w-[150px]">
                    <label class="block text-[10px] text-gray-400 uppercase tracking-wider mb-1 font-semibold">Ano do Modelo</label>
                    <select id="yearFilter" class="w-full bg-[#121212] border border-gray-700 text-sm text-white p-2.5 rounded-lg focus:ring-1 focus:ring-[#D5001C] focus:outline-none transition-all">
                        <option value="All">Todos os Anos</option>
                    </select>
                </div>
                <div class="flex-1 min-w-[150px]">
                    <label class="block text-[10px] text-gray-400 uppercase tracking-wider mb-1 font-semibold">Estado (UF)</label>
                    <select id="stateFilter" class="w-full bg-[#121212] border border-gray-700 text-sm text-white p-2.5 rounded-lg focus:ring-1 focus:ring-[#D5001C] focus:outline-none transition-all">
                        <option value="All">Todos os Estados</option>
                    </select>
                </div>
                <div class="flex-1 min-w-[150px]">
                    <label class="block text-[10px] text-gray-400 uppercase tracking-wider mb-1 font-semibold">Status de Entrega</label>
                    <select id="statusFilter" class="w-full bg-[#121212] border border-gray-700 text-sm text-white p-2.5 rounded-lg focus:ring-1 focus:ring-[#D5001C] focus:outline-none transition-all">
                        <option value="All">Todos os Status</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- KPIs (4 Indicadores convertidos e expandidos) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="glass-card p-6 rounded-2xl hover:border-[#D5001C] transition-colors duration-300">
                <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold mb-2">Receita Total</p>
                <h2 id="kpiRevenue" class="text-3xl font-bold text-white">R$ 0</h2>
            </div>
            <div class="glass-card p-6 rounded-2xl hover:border-[#D5001C] transition-colors duration-300">
                <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold mb-2">Ticket Médio</p>
                <h2 id="kpiAvgTicket" class="text-3xl font-bold text-white">R$ 0</h2>
            </div>
            <div class="glass-card p-6 rounded-2xl hover:border-[#D5001C] transition-colors duration-300">
                <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold mb-2">Veículos Vendidos</p>
                <h2 id="kpiVolume" class="text-3xl font-bold text-white">0</h2>
            </div>
            <div class="glass-card p-6 rounded-2xl hover:border-[#D5001C] transition-colors duration-300">
                <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold mb-2">Quilometragem Média</p>
                <h2 id="kpiMileage" class="text-3xl font-bold text-white">0 km</h2>
            </div>
        </div>

        <!-- Gráficos - Linha 1 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Linha: Receita no Tempo (Agrupado por Trimestre) -->
            <div class="glass-card p-6 rounded-2xl">
                <h3 class="text-gray-300 text-sm font-semibold mb-4">Evolução da Receita (Por Trimestre)</h3>
                <div class="relative h-72"><canvas id="lineChart"></canvas></div>
            </div>
            <!-- Rosca: Pagamentos (Com Percentagens e "Outros") -->
            <div class="glass-card p-6 rounded-2xl">
                <h3 class="text-gray-300 text-sm font-semibold mb-4">Métodos de Pagamento</h3>
                <div class="relative h-72"><canvas id="doughnutChart"></canvas></div>
            </div>
        </div>

        <!-- Gráficos - Linha 2 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Barras Horizontais: Receita por Modelo (Ordenado Top 10) -->
            <div class="glass-card p-6 rounded-2xl">
                <h3 class="text-gray-300 text-sm font-semibold mb-4">Top 10 Modelos Mais Rentáveis</h3>
                <div class="relative h-72"><canvas id="modelChart"></canvas></div>
            </div>
            <!-- Dispersão: Preço x Quilometragem -->
            <div class="glass-card p-6 rounded-2xl">
                <h3 class="text-gray-300 text-sm font-semibold mb-4">Análise: Preço vs. Quilometragem</h3>
                <div class="relative h-72"><canvas id="scatterChart"></canvas></div>
            </div>
        </div>
    </div>

    <script>
        let charts = {};
        
        // Formatação Monetária BR
        const currencyFmt = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
        
        // Fator de Conversão de Milhas para Quilómetros
        const MI_TO_KM = 1.60934;

        // Paleta de cores expandida (9 cores) para não repetir no gráfico de rosca
        const porschePalette = ['#D5001C', '#8A8D8F', '#4B4C4D', '#2B2B2B', '#1a1a1a', '#ff4d4d', '#cccccc', '#666666', '#333333'];

        // Defaults Globais
        Chart.defaults.color = '#8A8D8F';
        Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.05)';
        Chart.defaults.font.family = 'Inter';

        document.addEventListener("DOMContentLoaded", () => {
            populateFilters();
            ['yearFilter', 'stateFilter', 'statusFilter'].forEach(id => {
                document.getElementById(id).addEventListener('change', updateDashboard);
            });
            updateDashboard();
        });

        function populateFilters() {
            const years = [...new Set(rawData.map(d => d.ModelYear))].sort();
            const states = [...new Set(rawData.map(d => d.State))].sort();
            const statuses = [...new Set(rawData.map(d => d.DeliveryStatus))].sort();

            const createOpts = (arr, elId) => {
                const select = document.getElementById(elId);
                arr.forEach(val => {
                    const opt = document.createElement('option');
                    opt.value = val;
                    opt.textContent = val;
                    select.appendChild(opt);
                });
            };

            createOpts(years, 'yearFilter');
            createOpts(states, 'stateFilter');
            createOpts(statuses, 'statusFilter');
        }

        function getQuarter(dateStr) {
            const d = new Date(dateStr);
            const q = Math.floor(d.getMonth() / 3) + 1;
            return `Q${q} ${d.getFullYear()}`;
        }

        function formatK(val) {
            if (val >= 1000000) return 'R$ ' + (val / 1000000).toFixed(1) + 'M';
            if (val >= 1000) return 'R$ ' + (val / 1000).toFixed(0) + 'k';
            return 'R$ ' + val;
        }

        function updateDashboard() {
            const yearFilter = document.getElementById('yearFilter').value;
            const stateFilter = document.getElementById('stateFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;

            const filteredData = rawData.filter(d => {
                return (yearFilter === 'All' || d.ModelYear.toString() === yearFilter) &&
                       (stateFilter === 'All' || d.State === stateFilter) &&
                       (statusFilter === 'All' || d.DeliveryStatus === statusFilter);
            });

            // --- KPIs ---
            const totalRevenue = filteredData.reduce((acc, val) => acc + val.SalesPrice, 0);
            const volume = filteredData.length;
            const avgTicket = volume > 0 ? totalRevenue / volume : 0;
            const avgMileage = volume > 0 ? filteredData.reduce((acc, val) => acc + val.VehicleMileage, 0) / volume : 0;
            const avgKm = avgMileage * MI_TO_KM;

            document.getElementById('kpiRevenue').textContent = currencyFmt.format(totalRevenue);
            document.getElementById('kpiAvgTicket').textContent = currencyFmt.format(avgTicket);
            document.getElementById('kpiVolume').textContent = volume;
            document.getElementById('kpiMileage').textContent = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 }).format(avgKm) + ' km';

            // --- Dados ---
            const revenueByQuarter = {};
            filteredData.forEach(d => {
                const q = getQuarter(d.SaleDate);
                revenueByQuarter[q] = (revenueByQuarter[q] || 0) + d.SalesPrice;
            });
            const lineLabels = Object.keys(revenueByQuarter).sort((a, b) => {
                const [qA, yA] = a.split(' ');
                const [qB, yB] = b.split(' ');
                if (yA !== yB) return yA - yB;
                return qA.localeCompare(qB);
            });
            const lineData = lineLabels.map(q => revenueByQuarter[q]);

            const scatterData = filteredData.map(d => ({ x: Math.round(d.VehicleMileage * MI_TO_KM), y: d.SalesPrice }));

            const revByModel = {};
            filteredData.forEach(d => { revByModel[d.PorscheModel] = (revByModel[d.PorscheModel] || 0) + d.SalesPrice; });
            const sortedModels = Object.entries(revByModel).sort((a,b) => b[1] - a[1]).slice(0, 10);

            const payMethods = {};
            filteredData.forEach(d => { payMethods[d.PayMethod] = (payMethods[d.PayMethod] || 0) + 1; });
            
            let doughnutLabels = [];
            let doughnutData = [];
            let outrosCount = 0;
            
            Object.entries(payMethods).sort((a,b) => b[1] - a[1]).forEach(([method, count]) => {
                if (count / volume < 0.05) { 
                    outrosCount += count;
                } else {
                    doughnutLabels.push(method);
                    doughnutData.push(count);
                }
            });
            if (outrosCount > 0) {
                doughnutLabels.push('Outros');
                doughnutData.push(outrosCount);
            }

            // --- Renderizar ---
            renderChart('lineChart', 'line', {
                labels: lineLabels,
                datasets: [{ label: 'Receita (R$)', data: lineData, borderColor: '#D5001C', backgroundColor: 'rgba(213, 0, 28, 0.1)', fill: true, tension: 0.4, pointRadius: 4, pointBackgroundColor: '#fff' }]
            }, true);

            renderChart('scatterChart', 'scatter', {
                datasets: [{ label: 'Veículos', data: scatterData, backgroundColor: 'rgba(213, 0, 28, 0.6)', borderColor: '#D5001C', pointRadius: 6, pointHoverRadius: 8 }]
            }, true, true);

            renderChart('modelChart', 'bar', {
                labels: sortedModels.map(x => x[0]),
                datasets: [{ label: 'Receita', data: sortedModels.map(x => x[1]), backgroundColor: '#D5001C', hoverBackgroundColor: '#f00', borderRadius: 4 }]
            }, true, false, 'y');

            const ctxDoughnut = document.getElementById('doughnutChart').getContext('2d');
            if (charts['doughnutChart']) charts['doughnutChart'].destroy();
            charts['doughnutChart'] = new Chart(ctxDoughnut, {
                type: 'doughnut',
                data: {
                    labels: doughnutLabels,
                    datasets: [{ data: doughnutData, backgroundColor: porschePalette, borderWidth: 0 }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { color: '#8A8D8F' } },
                        datalabels: {
                            color: '#fff',
                            formatter: (value, ctx) => {
                                let sum = 0;
                                let dataArr = ctx.chart.data.datasets[0].data;
                                dataArr.map(data => { sum += data; });
                                return (value * 100 / sum).toFixed(1) + "%";
                            },
                            font: { weight: 'bold', size: 12 }
                        }
                    }
                }
            });
        }

        function renderChart(id, type, data, isCurrency, isScatter = false, indexAxis = 'x') {
            const ctx = document.getElementById(id).getContext('2d');
            if (charts[id]) charts[id].destroy();

            let options = {
                responsive: true, maintainAspectRatio: false,
                indexAxis: indexAxis,
                plugins: {
                    legend: { display: false },
                    datalabels: { display: false }, 
                    tooltip: {
                        callbacks: {
                            label: function(ctx) {
                                if (isScatter) return `Odómetro: ${ctx.parsed.x} km | Preço: ${currencyFmt.format(ctx.parsed.y)}`;
                                let val = ctx.parsed[indexAxis === 'y' ? 'x' : 'y'] || ctx.parsed;
                                return isCurrency ? currencyFmt.format(val) : val;
                            }
                        }
                    }
                },
                scales: {}
            };

            if (type !== 'doughnut') {
                // Configuração cuidadosa para não sobrepor os rótulos das categorias
                options.scales.x = { grid: { display: isScatter || type === 'line' } };
                if (isScatter || (isCurrency && indexAxis === 'y')) {
                    options.scales.x.ticks = { callback: function(val) { return formatK(val); } };
                }

                options.scales.y = { grid: { display: true } };
                if (isScatter || (isCurrency && indexAxis === 'x')) {
                    options.scales.y.ticks = { callback: function(val) { return formatK(val); } };
                }
            }

            charts[id] = new Chart(ctx, { type: type, data: data, options: options });
        }
    </script>
</body>
</html>
